# Gemma 4 26B-A4B-it (Unsloth UD-Q4_K_XL) + MTP speculative decoding — classifier-3090
#
# Standalone LLM stack for the RTX 3090 box (24 GB), separate from the main
# on-prem-workhorse compose that runs the 31B dense on the RTX 5090. Same serving
# engine (upstream llama.cpp), same flags — only the model and the CUDA build
# differ. LAN-only (192.168.1.138:8090), no tunnel.
#
# Why A4B instead of 31B dense: the dense Q6 needs ~30 GB and will not fit in
# 24 GB. The 26B MoE has only 4B ACTIVE params — fast even on a 3090 — and at
# Q4_K_XL the weights (~17 GB) + the F16 MTP draft (~0.85 GB) + a 64k q4_0 KV
# cache (~3 GB) land at ~21 GB, leaving ~3 GB headroom (same margin as the 5090).
#
# VRAM is BOUNDED BY DESIGN, not by a growth limiter: `-c 65536` pre-allocates
# the full KV cache up front, `-np 1` keeps a single slot, `-ctk/-ctv q4_0`
# shrink the KV 4x. The cache does not grow after load, so there is no
# OOM-after-hours risk once the container is healthy.
#
# IMPORTANT build pins for this box:
#   * driver 570 caps at CUDA 12.8 — the default CUDA 13.0 image would fail to
#     init, so we build with CUDA_TAG=12.8.0 (see deploy/Dockerfile).
#   * CUDA_ARCH=86 — native Ampere (sm_86), so no first-request JIT compile.
#   * runtime: nvidia (NOT `--gpus all`, which does not attach the GPU here).
#   * only ~15 GB system RAM: do NOT add `--no-mmap` — it would force the full
#     17 GB into host RAM and OOM the box. Default mmap streams weights to VRAM.
services:
  llm:
    build:
      context: ..                 # reuse deploy/Dockerfile + entrypoint.sh
      dockerfile: Dockerfile
      args:
        CUDA_TAG: "12.8.0"        # driver 570 max — 13.0 would fail to init
        CUDA_ARCH: "86"           # Ampere native, no runtime JIT
        BUILD_JOBS: "6"           # cap compile parallelism — 15 GB RAM box, avoid nvcc OOM
    image: on-prem-workhorse-llm-3090:latest
    container_name: ik-llama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - MODEL_PATH=/models/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      - HF_MODEL_URL=${HF_MODEL_URL}
      - DRAFT_PATH=/models/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-F16-MTP.gguf
      - HF_DRAFT_URL=${HF_DRAFT_URL}
    volumes:
      - ${MODEL_DIR:-/home/pawel/models}:/models
    ports:
      - "8090:8090"
    command:
      - -m
      - /models/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      - -ngl
      - "999"       # all layers on GPU
      - -fa
      - "1"         # flash attention (required for quantized KV)
      - -c
      - "65536"     # 64k context — KV is pre-allocated to this size and never grows
      - -ctk
      - q4_0        # KV cache 4-bit — ~4x smaller than q8_0
      - -ctv
      - q4_0
      - --host
      - "0.0.0.0"
      - --port
      - "8090"
      - -np
      - "1"         # single slot — fixed VRAM ceiling, no per-client cache growth
      - --spec-type
      - draft-mtp   # MTP speculative decoding — A4B ships its own F16 draft head
      - -md
      - /models/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-F16-MTP.gguf
      - --api-key
      - ${API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s # model load + warmup (no JIT on native sm_86 — faster than 5090)

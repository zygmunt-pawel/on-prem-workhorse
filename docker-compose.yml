services:
  scraper:
    build: .
    image: on-prem-workhorse:latest
    container_name: scraper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_KEY=${SCRAPER_API_KEY}
      - PROXY_URL=${PROXY_URL:-}
      # libuv default is 4 — too tight for spawning chromium under concurrency.
      # If a launch wedges a pool thread (DNS/fs/pipe setup in playwright-ghost),
      # every subsequent /scrape-site queues forever. Larger pool absorbs hangs.
      - UV_THREADPOOL_SIZE=16
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Gemma 4 26B-A4B, NVIDIA NVFP4 weights + Google's official MTP assistant.
  # The server admits up to 80 short/medium sequences; the FP8 KV pool is the
  # independent hard limit for long contexts.
  # NOTE: historical service name retained so existing compose commands keep working.
  ik-llama:
    image: on-prem-workhorse-vllm:v0.25.0-gemma4-mtp
    build:
      context: ./deploy/vllm
      dockerfile: Dockerfile
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.25.0
    container_name: ik-llama
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      # vLLM reads this directly. Keeping the key out of argv prevents startup
      # config logs and process inspection from exposing it.
      - VLLM_API_KEY=${API_KEY}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-32768}
      - VLLM_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS:-80}
      - VLLM_MAX_NUM_BATCHED_TOKENS=${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.94}
      - VLLM_KV_CACHE_DTYPE=${VLLM_KV_CACHE_DTYPE:-fp8}
      - VLLM_KV_CACHE_DTYPE_SKIP_LAYERS=${VLLM_KV_CACHE_DTYPE_SKIP_LAYERS:-}
    volumes:
      - ${MODEL_DIR}/hf:/models:ro
      - ${VLLM_CACHE_DIR:-/home/pawel/.cache/vllm-gemma4-bench}:/root/.cache
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s # model load + cached CUDA graph restore

volumes:
  models_data:

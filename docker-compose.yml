services:
  # Gemma 4 26B-A4B with NVIDIA NVFP4 weights. MTP is disabled by default after
  # the 2026-09-15 high-concurrency JSON benchmark; it remains opt-in for A/Bs.
  # The server admits up to 64 short/medium sequences; the FP8 KV pool is the
  # independent hard limit for long contexts.
  # NOTE: historical service name retained so existing compose commands keep working.
  ik-llama:
    image: on-prem-workhorse-vllm:v0.29.0-gemma4-mtp
    build:
      context: ./deploy/vllm
      dockerfile: Dockerfile
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.29.0@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
    container_name: ik-llama
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_NO_USAGE_STATS=1
      - VLLM_USE_V2_MODEL_RUNNER=1
      - DO_NOT_TRACK=1
      # FlashInfer's fused-MoE workspace is allocated dynamically. Expandable
      # segments let PyTorch reuse fragmented reserved memory under mixed waves.
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      # vLLM reads this directly. Keeping the key out of argv prevents startup
      # config logs and process inspection from exposing it.
      - VLLM_API_KEY=${API_KEY}
      # Use an application-owned prefix inside the container. vLLM reserves
      # VLLM_* and warns about unknown names before our entrypoint can consume them.
      - ON_PREM_VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-32768}
      - ON_PREM_VLLM_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS:-64}
      - ON_PREM_VLLM_SCHEDULING_POLICY=${VLLM_SCHEDULING_POLICY:-priority}
      - ON_PREM_VLLM_MAX_NUM_BATCHED_TOKENS=${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      - ON_PREM_VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.92}
      - ON_PREM_VLLM_KV_CACHE_DTYPE=${VLLM_KV_CACHE_DTYPE:-fp8}
      - ON_PREM_VLLM_KV_CACHE_DTYPE_SKIP_LAYERS=${VLLM_KV_CACHE_DTYPE_SKIP_LAYERS:-}
      - ON_PREM_VLLM_ATTENTION_BACKEND=${VLLM_ATTENTION_BACKEND:-TRITON_ATTN}
      - ON_PREM_VLLM_MOE_BACKEND=${VLLM_MOE_BACKEND:-flashinfer_cutlass}
      - ON_PREM_VLLM_MTP_NUM_SPECULATIVE_TOKENS=${VLLM_MTP_NUM_SPECULATIVE_TOKENS:-0}
    volumes:
      - ${MODEL_DIR}/hf:/models:ro
      - ${VLLM_CACHE_DIR:-/home/server/.cache/vllm-gemma4-v029}:/root/.cache
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s # model load + cached CUDA graph restore

volumes:
  models_data:

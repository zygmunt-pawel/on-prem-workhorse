services:
  scraper:
    build: .
    image: on-prem-workhorse:latest
    container_name: scraper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_KEY=${SCRAPER_API_KEY}
      - PROXY_URL=${PROXY_URL:-}
      # libuv default is 4 — too tight for spawning chromium under concurrency.
      # If a launch wedges a pool thread (DNS/fs/pipe setup in playwright-ghost),
      # every subsequent /scrape-site queues forever. Larger pool absorbs hangs.
      - UV_THREADPOOL_SIZE=16
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Gemma 4 26B-A4B, NVIDIA NVFP4 weights + Google's official MTP assistant.
  # vLLM selects FLASHINFER_CUTLASS on the RTX 5090; eight parallel 32k slots.
  # NOTE: historical service name retained so existing compose commands keep working.
  ik-llama:
    image: on-prem-workhorse-vllm:v0.25.0-gemma4-mtp
    build:
      context: ./deploy/vllm
      dockerfile: Dockerfile
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.25.0
    container_name: ik-llama
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
    volumes:
      - ${MODEL_DIR}/hf:/models:ro
      - ${VLLM_CACHE_DIR:-/home/pawel/.cache/vllm-gemma4-bench}:/root/.cache
    ports:
      - "8090:8000"
    command:
      - --model
      - /models/Gemma-4-26B-A4B-NVFP4
      - --served-model-name
      - gemma-4-26B-A4B-it
      - Gemma-4-26B-A4B-NVFP4
      - gemma-4-31B-it-UD-Q6_K_XL.gguf
      - gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      - --trust-remote-code
      - --language-model-only
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
      - --gpu-memory-utilization
      - "0.95"
      - --kv-cache-dtype
      - fp8
      - --moe-backend
      - auto
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --async-scheduling
      - --speculative-config
      - '{"method":"mtp","model":"/models/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":4}'
      - --api-key
      - ${API_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s # model load + cached CUDA graph restore

volumes:
  models_data:
